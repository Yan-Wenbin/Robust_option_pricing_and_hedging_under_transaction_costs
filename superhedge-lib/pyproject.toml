[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "superhedge"
version = "1.2.0"
description = "Super-hedging prices and strategies for convex European claims under proportional transaction costs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Amal Omrani" }, { name = "Wenbin Yan" }]
keywords = ["super-hedging", "transaction costs", "robust hedging", "option pricing", "quantitative finance"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
examples = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
